<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PROJECT NULL - 3D Hybrid</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #000; overflow: hidden; font-family: 'Courier New', monospace; }
  
  /* 2D Text Game UI */
  #game-2d {
    background: #0a0a0f;
    color: #c8c8d4;
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 80%; max-width: 800px;
    height: 80vh; max-height: 600px;
    padding: 20px;
    border: 1px solid #1a1a2e;
    border-radius: 8px;
    z-index: 10;
    display: flex;
    flex-direction: column;
  }
  #scanline {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.08) 2px, rgba(0,0,0,0.08) 4px);
    pointer-events: none; z-index: 1;
  }
  #content { position: relative; z-index: 2; flex-grow: 1; display: flex; flex-direction: column; }
  #topbar {
    display: flex; justify-content: space-between; align-items: center;
    border-bottom: 1px solid #1e1e3a; padding-bottom: 10px; margin-bottom: 18px;
    font-size: 11px; color: #555570;
  }
  #title-bar { color: #8888bb; font-size: 13px; letter-spacing: 4px; text-transform: uppercase; }
  #stats { display: flex; gap: 20px; font-size: 12px; }
  .stat-label { color: #444455; }
  .stat-val { color: #9999cc; }
  #scene-title { font-size: 15px; color: #aaaadd; margin-bottom: 14px; letter-spacing: 2px; }
  #narrative {
    font-size: 13px; line-height: 1.9; color: #b0b0c8;
    min-height: 100px; margin-bottom: 20px;
    border-left: 2px solid #1a1a3a; padding-left: 14px;
    flex-grow: 1;
  }
  #choices { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
  .choice-btn {
    background: transparent; border: 1px solid #2a2a4a;
    color: #9999cc; padding: 10px 16px; text-align: left;
    font-family: 'Courier New', monospace; font-size: 12px;
    cursor: pointer; border-radius: 4px; transition: all 0.15s;
    letter-spacing: 0.5px;
  }
  .choice-btn:hover { background: #0f0f2a; border-color: #5555aa; color: #ccccff; }
  #atmosphere { font-size: 11px; color: #3a3a5a; font-style: italic; }
  #progress-bar {
    height: 2px; background: #0f0f1f; margin-bottom: 16px;
    border-radius: 2px; overflow: hidden;
  }
  #progress-fill { height: 100%; background: #4444aa; transition: width 0.5s; }
  
  #cursor-blink {
    display: inline-block; width: 8px; height: 14px;
    background: #9999cc; vertical-align: middle;
    animation: blink 0.7s infinite;
  }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

  /* 3D Game UI */
  #game-3d-container {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    z-index: 20; display: none; background: #000;
  }
  #game-3d-canvas {
    width: 100% !important; height: 100% !important;
    image-rendering: pixelated; /* PS1 Retro Style */
  }
  #crosshair {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    color: rgba(255, 255, 255, 0.5);
    font-size: 24px; pointer-events: none; z-index: 21;
  }
  #objective-ui {
    position: absolute; top: 20px; left: 20px;
    color: #ffaaaa; font-size: 16px; text-shadow: 1px 1px 0 #000;
    z-index: 21; pointer-events: none;
    border-left: 3px solid #ff4444; padding-left: 10px;
    background: rgba(0,0,0,0.5); padding: 10px;
  }
  #blocker {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.8); z-index: 22;
    display: flex; justify-content: center; align-items: center;
    color: #fff; flex-direction: column; text-align: center;
    cursor: pointer;
  }
  .instructions { font-size: 14px; line-height: 2; color: #aaa; margin-top: 20px;}
  .click-to-start { font-size: 20px; color: #fff; animation: blink 1.5s infinite; }

  /* Glitch overlay */
  #glitch-overlay {
    display: none; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    z-index: 100; background: #0a0a0f; overflow: hidden;
  }
  #glitch-overlay.active { display: block; }
  .glitch-line {
    position: absolute; left: 0; right: 0; height: 3px;
    background: #5555ff; opacity: 0.6;
    animation: glitch-move 0.1s infinite;
  }
  .glitch-block {
    position: absolute; background: rgba(80,80,200,0.15);
    animation: flicker 0.05s infinite;
  }
  #error-text {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    text-align: center; z-index: 101;
  }
  #error-code {
    font-family: 'Courier New', monospace; font-size: 11px;
    color: #6666ff; line-height: 1.6; white-space: pre;
    text-align: left; display: inline-block;
  }

  @keyframes flicker { 0%,100%{opacity:0.15} 50%{opacity:0.35} }

let state = { scene: 0, sanity: 100, depth: 1 };
let typeTimer = null;

// ==========================================
// 2D GAME LOGIC
// ==========================================
function getScene(id) { return scenes.find(s => s.id === id); }

function updateStats() {
  document.getElementById('sanity-val').textContent = state.sanity;
  document.getElementById('depth-val').textContent = state.depth;
  const progress = Math.min(95, state.depth * 14);
  document.getElementById('progress-fill').style.width = progress + '%';
  if (state.sanity < 40) document.getElementById('sanity-val').style.color = '#ff6666';
  else if (state.sanity < 70) document.getElementById('sanity-val').style.color = '#ffaa44';
}

function typeText(el, text, cb) {
  if (typeTimer) clearInterval(typeTimer);
  el.textContent = '';
  let i = 0;
  const lines = text.split('\n');
  let fullText = '';
  typeTimer = setInterval(() => {
    if (i < text.length) {
      fullText += text[i];
      el.innerHTML = fullText.replace(/\n/g,'<br>') + '<span id="cursor-blink"></span>';
      i++;
    } else {
      el.innerHTML = fullText.replace(/\n/g,'<br>');
      clearInterval(typeTimer);
      if (cb) cb();
    }
  }, 55); // Slowed down text speed
}

function showScene(id) {
  if (id === 'GLITCH') { triggerGlitch(); return; }
  const scene = getScene(id);
  if (!scene) return;
  
  if (scene.mode === '3d') {
    start3DScene(scene.level);
    return;
  }
  
  // Show 2D Interface
  document.getElementById('game-2d').style.display = 'flex';
  document.getElementById('game-3d-container').style.display = 'none';
  
  state.scene = id;
  document.getElementById('scene-title').textContent = scene.title;
  document.getElementById('choices').innerHTML = '';
  document.getElementById('atmosphere').textContent = '';
  const narr = document.getElementById('narrative');
  typeText(narr, scene.text, () => {
    document.getElementById('atmosphere').textContent = scene.atm;
    renderChoices(scene.choices);
  });
  updateStats();
}

function renderChoices(choices) {
  const cont = document.getElementById('choices');
  cont.innerHTML = '';
  choices.forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.textContent = c.text;
    btn.onclick = () => {
      if (c.sanity) state.sanity = Math.max(0, state.sanity + c.sanity);
      state.depth++;
      showScene(c.next);
    };
    cont.appendChild(btn);
  });
}

function triggerGlitch() {
  const overlay = document.getElementById('glitch-overlay');
  const errorCode = document.getElementById('error-code');
  overlay.classList.add('active');
  document.getElementById('game-2d').style.transform = 'translate(-50%, -50%) scale(1.02)';
  
  let msg = "FATAL ERROR\n> Entity Overflow in memory address 0xDEAD\n> Connection Lost...";
  errorCode.textContent = msg;
  
  setTimeout(() => {
    document.body.innerHTML = '<div style="color:red; font-family:monospace; margin:50px;">끝. 탈출 실패.</div>';
  }, 2000);
}

// 3D GAME LOGIC (THREE.JS)

let flashlight;
let flashlightOn = true;
let walls = [], triggers = [];
let is3DActive = false;
let currentLevelData = null;

let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
let prevTime = performance.now();
const velocity = new THREE.Vector3();
const direction = new THREE.Vector3();
const UNIT_SIZE = 4;
const PLAYER_HEIGHT = 2;

function generateNoiseTexture(color1, color2, w=64, h=64) {
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d');
  const imgData = ctx.createImageData(w, h);
  const data = imgData.data;
  const c1 = new THREE.Color(color1);
  const c2 = new THREE.Color(color2);
  for(let i=0; i<data.length; i+=4) {
    const t = Math.random();
    data[i] = (c1.r + (c2.r - c1.r)*t) * 255;
    data[i+1] = (c1.g + (c2.g - c1.g)*t) * 255;
    data[i+2] = (c1.b + (c2.b - c1.b)*t) * 255;
    data[i+3] = 255;
  }
  ctx.putImageData(imgData, 0, 0);
  const tex = new THREE.CanvasTexture(canvas);
  tex.magFilter = THREE.NearestFilter;
  tex.minFilter = THREE.NearestFilter;
  return tex;
}

function init3D() {
  const container = document.getElementById('game-3d-container');
  camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 100);
  
  scene3d = new THREE.Scene();
  scene3d.background = new THREE.Color(0x050508);
  scene3d.fog = new THREE.Fog(0x050508, 1, 35); // Increased render distance so the building is visible

  // Lights
  const light = new THREE.HemisphereLight(0x333344, 0x000000, 0.8);
  scene3d.add(light);
  
  flashlight = new THREE.SpotLight(0xffeedd, 1.5, 45, Math.PI / 5, 0.5, 1);
  flashlight.position.set(0, 0, 0);
  flashlight.target.position.set(0, 0, -1);
  camera.add(flashlight);
  camera.add(flashlight.target);
  scene3d.add(camera);

  // Renderer setup for PS1 Pixelation
  renderer = new THREE.WebGLRenderer({ antialias: false });
  renderer.setPixelRatio(0.3); // Very low resolution for chunky pixels
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.domElement.id = 'game-3d-canvas';
  container.insertBefore(renderer.domElement, container.firstChild);

  controls = new THREE.PointerLockControls(camera, document.body);
  const blocker = document.getElementById('blocker');

  blocker.addEventListener('click', function () {
    if(is3DActive) controls.lock();
  });

  controls.addEventListener('lock', function () {
    blocker.style.display = 'none';
  });

  controls.addEventListener('unlock', function () {
    if (is3DActive) blocker.style.display = 'flex';
  });

  document.addEventListener('keydown', onKeyDown);
  document.addEventListener('keyup', onKeyUp);
  window.addEventListener('resize', onWindowResize);
  
  requestAnimationFrame(animate3D);
}

function onKeyDown(event) {
  switch (event.code) {
    case 'ArrowUp': case 'KeyW': moveForward = true; break;
    case 'ArrowLeft': case 'KeyA': moveLeft = true; break;
    case 'ArrowDown': case 'KeyS': moveBackward = true; break;
    case 'ArrowRight': case 'KeyD': moveRight = true; break;
    case 'KeyF':
      flashlightOn = !flashlightOn;
      if (flashlight) flashlight.visible = flashlightOn;
      break;
  }
}
function onKeyUp(event) {
  switch (event.code) {
    case 'ArrowUp': case 'KeyW': moveForward = false; break;
    case 'ArrowLeft': case 'KeyA': moveLeft = false; break;
    case 'ArrowDown': case 'KeyS': moveBackward = false; break;
    case 'ArrowRight': case 'KeyD': moveRight = false; break;
  }
}

function onWindowResize() {
  if(!camera) return;
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

function buildLevel(level) {
  // Clear old level
  walls.forEach(w => scene3d.remove(w));
  triggers.forEach(t => scene3d.remove(t));
  walls = []; triggers = [];
  
  const grid = level.grid;
  
  // Materials with generated noise textures
  const wallMat = new THREE.MeshLambertMaterial({ map: generateNoiseTexture(0x222233, 0x11111a) });
  const floorMat = new THREE.MeshLambertMaterial({ map: generateNoiseTexture(0x11111a, 0x050508) });
  const triggerMat = new THREE.MeshBasicMaterial({ color: 0xff4444, wireframe: true });

  const geoWall = new THREE.BoxGeometry(UNIT_SIZE, UNIT_SIZE*2, UNIT_SIZE);
  const geoFloor = new THREE.PlaneGeometry(UNIT_SIZE, UNIT_SIZE);
  geoFloor.rotateX(-Math.PI / 2);

  for(let z=0; z<grid.length; z++) {
    for(let x=0; x<grid[z].length; x++) {
      const type = grid[z][x];
      const posX = x * UNIT_SIZE;
      const posZ = z * UNIT_SIZE;
      
      // Floor everywhere
      const floor = new THREE.Mesh(geoFloor, floorMat);
      floor.position.set(posX, 0, posZ);
      scene3d.add(floor);

      if (type === 1) {
        // Wall
        const wall = new THREE.Mesh(geoWall, wallMat);
        wall.position.set(posX, UNIT_SIZE, posZ);
        scene3d.add(wall);
        
        // Simple bounding box for collision
        wall.boundingBox = new THREE.Box3().setFromObject(wall);
        walls.push(wall);
      } else if (type === 2) {
        // Trigger (Door / Entrance)
        const doorMat = new THREE.MeshBasicMaterial({ color: 0xff0000 }); // Solid bright red
        const trigger = new THREE.Mesh(new THREE.BoxGeometry(UNIT_SIZE * 1.5, UNIT_SIZE * 2, UNIT_SIZE * 1.5), doorMat);
        trigger.position.set(posX, UNIT_SIZE, posZ);
        scene3d.add(trigger);
        
        const doorLight = new THREE.PointLight(0xff0000, 5, 40); // Stronger light to wash the surrounding area in red
        doorLight.position.set(posX, UNIT_SIZE, posZ);
        scene3d.add(doorLight);
        
        trigger.boundingBox = new THREE.Box3().setFromObject(trigger);
        triggers.push(trigger);
      } else if (type === 3) {
        // Tree (Trunk + Leaves)
        const trunkMat = new THREE.MeshLambertMaterial({ map: generateNoiseTexture(0x3d2817, 0x1e1208) });
        const leafMat = new THREE.MeshLambertMaterial({ map: generateNoiseTexture(0x1a4314, 0x0d220a) });
        const treeGroup = new THREE.Group();
        const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.6, 2), trunkMat);
        trunk.position.y = 1;
        treeGroup.add(trunk);
        const leaves = new THREE.Mesh(new THREE.ConeGeometry(2, 3, 5), leafMat);
        leaves.position.y = 3;
        treeGroup.add(leaves);
        
        treeGroup.position.set(posX, 0, posZ);
        treeGroup.rotation.y = Math.random() * Math.PI;
        const scale = 0.8 + Math.random() * 0.4;
        treeGroup.scale.set(scale, scale, scale);
        
        scene3d.add(treeGroup);
        const box = new THREE.Box3();
        box.setFromCenterAndSize(new THREE.Vector3(posX, 1.5, posZ), new THREE.Vector3(2, 5, 2));
        treeGroup.boundingBox = box;
        walls.push(treeGroup);
      } else if (type === 4) {
        // Exterior Building Wall (Taller and more imposing)
        const extWallMat = new THREE.MeshLambertMaterial({ map: generateNoiseTexture(0x2a2a30, 0x151518) });
        const wall = new THREE.Mesh(new THREE.BoxGeometry(UNIT_SIZE, UNIT_SIZE * 3, UNIT_SIZE), extWallMat);
        wall.position.set(posX, UNIT_SIZE * 1.5, posZ);
        scene3d.add(wall);
        wall.boundingBox = new THREE.Box3().setFromObject(wall);
        walls.push(wall);
      }
    }
  }

  // Set Player Start
  camera.position.set(level.playerStart.x * UNIT_SIZE, PLAYER_HEIGHT, level.playerStart.y * UNIT_SIZE);
  controls.getObject().position.copy(camera.position);
  controls.getObject().rotation.y = Math.PI; // Face +Z (towards the building)
}

function start3DScene(level) {
  if(!renderer) init3D();
  
  currentLevelData = level;
  is3DActive = true;
  document.getElementById('game-2d').style.display = 'none';
  document.getElementById('game-3d-container').style.display = 'block';
  document.getElementById('objective-ui').textContent = level.objective;
  
  buildLevel(level);
}

function end3DScene() {
  is3DActive = false;
  controls.unlock();
  document.getElementById('game-3d-container').style.display = 'none';
  
  // Proceed to next 2D scene
  state.depth++;
  showScene(currentLevelData.next);
}

function checkCollision(pos) {
  const playerBox = new THREE.Box3();
  const playerSize = 1.0;
  playerBox.min.set(pos.x - playerSize, 0, pos.z - playerSize);
  playerBox.max.set(pos.x + playerSize, PLAYER_HEIGHT*2, pos.z + playerSize);

  for (let i = 0; i < walls.length; i++) {
    if (playerBox.intersectsBox(walls[i].boundingBox)) {
      return true;
    }
  }
  return false;
}

function animate3D() {
  requestAnimationFrame(animate3D);

  if (is3DActive && controls.isLocked) {
    const time = performance.now();
    const delta = (time - prevTime) / 1000;

    velocity.x -= velocity.x * 10.0 * delta;
    velocity.z -= velocity.z * 10.0 * delta;

    direction.z = Number(moveForward) - Number(moveBackward);
    direction.x = Number(moveLeft) - Number(moveRight);
    direction.normalize();

    if (moveForward || moveBackward) velocity.z -= direction.z * 40.0 * delta;
    if (moveLeft || moveRight) velocity.x -= direction.x * 40.0 * delta;

    const controlObj = controls.getObject();
    const oldPos = controlObj.position.clone();

    // Move X
    controlObj.translateX(velocity.x * delta);
    if (checkCollision(controlObj.position)) {
      controlObj.position.x = oldPos.x;
      velocity.x = 0;
    }

    // Move Z
    controlObj.translateZ(velocity.z * delta);
    if (checkCollision(controlObj.position)) {
      controlObj.position.z = oldPos.z;
      velocity.z = 0;
    }
    
    // Head Bobbing effect
    if(moveForward || moveBackward || moveLeft || moveRight) {
      camera.position.y = PLAYER_HEIGHT + Math.sin(time * 0.01) * 0.15;
    } else {
      camera.position.y = PLAYER_HEIGHT;
    }

    // Check Trigger Collision
    const playerBox = new THREE.Box3();
    playerBox.setFromCenterAndSize(controlObj.position, new THREE.Vector3(1, 1, 1));
    for (let i = 0; i < triggers.length; i++) {
      if (playerBox.intersectsBox(triggers[i].boundingBox)) {
        end3DScene(); // Reached objective
        break;
      }
    }

    prevTime = time;
  } else {
    prevTime = performance.now();
  }

  if (is3DActive) {
    // Make triggers pulse
    triggers.forEach(t => {
      t.rotation.y += 0.02;
      t.rotation.x += 0.01;
    });
    renderer.render(scene3d, camera);
  }
}

// Start Game
showScene(0);

</script>
